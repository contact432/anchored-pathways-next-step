<title>Workbooks | Anchored Pathways</title>

<link rel="icon" type="image/png" sizes="32x32" href="../favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="../favicon-16x16.png">
<link rel="icon" type="image/png" sizes="192x192" href="../favicon-192x192.png">
<link rel="icon" type="image/png" sizes="512x512" href="../favicon-512x512.png">

<style>
  :root {
    --teal: #1A5F6E;
    --navy: #14505E;
    --gold: #F5A623;
    --amber: #E8832A;
    --paper: #FCFBF8;
    --ink: #1E2B2E;
    --line: #E4E0D5;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    font-family: 'Questrial', 'Avenir', sans-serif;
    background: var(--paper);
    color: var(--ink);
    padding-bottom: 40px;
  }
  h1, h2, h3, h4, .heading-font {
    font-family: 'Avenir', 'Avenir Next', 'Poppins', sans-serif;
  }

  header {
    background: linear-gradient(135deg, var(--teal), var(--navy));
    color: white;
    padding: 22px 18px 16px;
    position: sticky;
    top: 0;
    z-index: 30;
  }
  .top-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  header .eyebrow {
    font-size: 11.5px; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--gold); font-weight: 600;
  }
  header h1 { font-size: 22px; font-weight: 700; margin: 4px 0 2px; }
  header p { margin: 0; font-size: 12.5px; opacity: 0.88; }

  /* This EN/ES toggle only controls long body/paragraph text (the material that would
     double in length if shown twice at once). Headings, labels, buttons, and links
     always show English then Spanish together via the .es secondary-line pattern below. */
  .lang-toggle { display: flex; background: rgba(255,255,255,0.14); border-radius: 999px; padding: 3px; flex-shrink: 0; }
  .lang-toggle button {
    border: none; background: none; color: rgba(255,255,255,0.75);
    font-family: 'Avenir', 'Avenir Next', 'Poppins', sans-serif; font-weight: 600; font-size: 12.5px;
    padding: 6px 12px; border-radius: 999px; cursor: pointer;
  }
  .lang-toggle button.active { background: var(--gold); color: var(--navy); }

  /* Secondary Spanish line shown directly beneath an English heading/label/button,
     matching the main app's .es pattern (muted, slightly smaller, italic). */
  .es { display: block; font-style: italic; opacity: 0.78; }
  h3 .es, h2 .es, .sec-head .es { font-size: 0.78em; font-weight: 600; margin-top: 2px; }
  label .es, .picker-card .go .es, th .es, .scenario .q .es { font-size: 0.85em; font-weight: 600; margin-top: 1px; }
  .back-btn .es, .finish-clear-btn .es { font-size: 0.82em; font-weight: 600; margin-top: 1px; }
  .linklist a .es, .crosslinks a .es { font-size: 0.85em; font-weight: 600; margin-top: 1px; }
  .picker-card p.es-desc { font-size: 0.92em; font-style: italic; opacity: 0.78; margin: 2px 0 0; color: #55605f; }

  main { padding: 16px; max-width: 640px; margin: 0 auto; }

  /* Picker / landing */
  .picker-intro { font-size: 14px; color: #45524f; line-height: 1.55; margin: 4px 0 18px; }
  .picker-grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
  .picker-card {
    display: block; text-align: left; width: 100%; background: white; border: 1px solid var(--line);
    border-radius: 14px; padding: 16px; cursor: pointer; font-family: inherit;
  }
  .picker-card:active { background: #F4F1EA; }
  .picker-card h3 {
    margin: 0 0 4px; font-size: 16.5px; color: var(--navy);
    font-family: 'Avenir', 'Avenir Next', 'Poppins', sans-serif; font-weight: 700;
  }
  .picker-card p { margin: 0; font-size: 13px; color: #55605f; line-height: 1.45; }
  .picker-card .go { display: inline-block; margin-top: 8px; font-size: 12.5px; font-weight: 600; color: var(--amber); }

  .crosslinks { margin-top: 22px; padding-top: 16px; border-top: 1px solid var(--line); }
  .crosslinks a {
    display: block; color: var(--teal); font-weight: 600; text-decoration: none; font-size: 13.5px;
    margin-bottom: 10px;
  }

  /* Workbook chrome */
  .wb-topbar { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; margin-top: 12px; }
  .back-btn {
    border: 1px solid rgba(255,255,255,0.5); background: rgba(255,255,255,0.1); color: white;
    border-radius: 999px; padding: 6px 14px; font-size: 12.5px; font-weight: 600; cursor: pointer;
    font-family: inherit;
  }
  .wb-title-block h2 { font-size: 18px; margin: 0; color: white; font-weight: 700; line-height: 1.25; }
  .wb-title-block h2 .es { font-size: 0.8em; font-weight: 600; opacity: 0.85; margin-top: 2px; }
  .wb-title-block p { margin: 0; font-size: 12px; opacity: 0.85; color: white; }

  .privacy-notice {
    background: #FCEBD9; border: 1px solid var(--gold); border-radius: 10px; padding: 13px 14px; margin: 16px 0 18px;
  }
  .privacy-notice p { margin: 0 0 6px; font-size: 12.8px; color: var(--navy); line-height: 1.5; }
  .privacy-notice p:last-child { margin-bottom: 0; }

  .section-block {
    margin-bottom: 20px; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: white;
    break-inside: avoid; page-break-inside: avoid;
  }
  .section-block .sec-head {
    padding: 13px 15px; background: #F4F1EA; font-weight: 700; font-size: 15.5px; color: var(--navy);
    font-family: 'Avenir', 'Avenir Next', 'Poppins', sans-serif;
  }
  .section-block .sec-body { padding: 12px 15px 15px; }
  .section-block .sec-body p { font-size: 13.8px; line-height: 1.55; color: #34423f; margin: 0 0 12px; }
  .section-block .sec-body p:last-child { margin-bottom: 0; }

  .intro-text { font-size: 13.5px; color: #55605f; line-height: 1.55; margin: 0 0 16px; }
  .how-to-use { background: white; border: 1px solid var(--line); border-radius: 12px; padding: 14px 15px; margin-bottom: 18px; }
  .how-to-use h3 { margin: 0 0 6px; font-size: 14.5px; color: var(--teal); }
  .how-to-use p { margin: 0; font-size: 13.3px; color: #34423f; line-height: 1.55; }

  .check-row { display: flex; align-items: flex-start; gap: 9px; padding: 7px 0; font-size: 13.8px; line-height: 1.4; }
  .check-row input { width: 19px; height: 19px; margin-top: 1px; accent-color: var(--teal); flex-shrink: 0; }

  .field-row { margin-bottom: 12px; }
  .field-row label { display: block; font-size: 12.5px; font-weight: 600; color: var(--navy); margin-bottom: 4px; }
  .field-row input[type=text], .field-row input[type=date], .field-row textarea {
    width: 100%; padding: 10px 11px; border: 1px solid var(--line); border-radius: 8px;
    font-family: inherit; font-size: 14px; color: var(--ink); background: var(--paper);
  }
  .field-row textarea { min-height: 70px; resize: vertical; }
  .fields-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }

  .scenario { border-left: 3px solid var(--gold); padding: 8px 0 8px 12px; margin-bottom: 14px; }
  .scenario:last-child { margin-bottom: 0; }
  .scenario .q {
    font-weight: 700; font-size: 13.8px; color: var(--navy); margin: 0 0 4px;
    font-family: 'Avenir', 'Avenir Next', 'Poppins', sans-serif;
  }
  .scenario .a { font-size: 13.3px; color: #34423f; line-height: 1.5; margin: 0; }

  .linklist { margin-top: 10px; }
  .linklist a {
    display: block; font-size: 13px; color: var(--teal); text-decoration: none; font-weight: 600; margin-bottom: 6px;
    word-break: break-word;
  }
  .linklist a:last-child { margin-bottom: 0; }

  table.status-table { width: 100%; border-collapse: collapse; margin: 10px 0 4px; font-size: 12.5px; }
  table.status-table th, table.status-table td {
    border: 1px solid var(--line); padding: 6px 6px; text-align: left; vertical-align: top;
  }
  table.status-table th { background: #F4F1EA; color: var(--navy); font-size: 11.5px; }
  table.status-table td.area-cell { font-weight: 600; color: var(--navy); width: 26%; }
  table.status-table td input {
    width: 100%; border: none; background: transparent; font-family: inherit; font-size: 12.5px; color: var(--ink);
    padding: 2px;
  }
  .table-scroll { overflow-x: auto; }

  .glossary-list { margin: 6px 0 0; padding-left: 18px; }
  .glossary-list li { font-size: 13.3px; color: #34423f; margin-bottom: 8px; line-height: 1.5; }

  .finish-clear-wrap { margin: 22px 0 8px; text-align: center; }
  .finish-clear-btn {
    border: 1px solid var(--teal); color: var(--teal); background: white;
    border-radius: 999px; padding: 11px 22px; font-size: 13.5px; font-weight: 700;
    font-family: 'Avenir', 'Avenir Next', 'Poppins', sans-serif; cursor: pointer;
  }
  .finish-confirmed {
    margin-top: 10px; font-size: 12.8px; color: var(--teal); font-weight: 600;
  }

  .closing-block {
    margin: 22px 0 10px; padding: 16px; background: white; border: 1px solid var(--line); border-radius: 12px;
    break-inside: avoid;
  }
  .closing-block p { font-size: 13.3px; line-height: 1.55; color: #34423f; margin: 0 0 8px; }
  .closing-block p:last-child { margin-bottom: 0; }
  .closing-block .es-closing { font-style: italic; color: var(--teal); }

  .sources-note { font-size: 11.5px; color: #8b8b7f; margin: 10px 0; line-height: 1.5; }
  .sources-note a { color: #8b8b7f; }

  footer.org-footer { text-align: center; padding: 22px 18px 8px; font-size: 11.5px; color: #8b8b7f; line-height: 1.6; }
  footer.org-footer a { color: var(--teal); font-weight: 600; text-decoration: none; }

  [hidden] { display: none !important; }

  @media (min-width: 520px) {
    .fields-grid { grid-template-columns: 1fr 1fr 1fr; }
    .picker-grid { grid-template-columns: 1fr 1fr; }
  }

  @media print {
    header, .lang-toggle, .back-btn, .privacy-notice, .finish-clear-wrap, .picker-grid, .picker-intro,
    .crosslinks, #langToggleWrap, .wb-topbar-print-hide { display: none !important; }
    body { padding-bottom: 0; background: white; }
    main { max-width: 100%; padding: 0; }
    .section-block { border: 1px solid #999; break-inside: avoid; page-break-inside: avoid; margin-bottom: 14px; }
    .field-row input[type=text], .field-row input[type=date] {
      border: none; border-bottom: 1px solid #333; border-radius: 0; background: transparent; padding: 4px 2px;
    }
    .field-row textarea { border: 1px solid #333; background: transparent; }
    table.status-table td input { border-bottom: 1px solid #999; }
    .linklist a::after { content: " (" attr(href) ")"; font-size: 10px; color: #555; }
    a { color: #000 !important; text-decoration: underline; }
  }
</style>
</head>

sidad de la lista. Un préstamo privado es una conversación para tener primero con un navegador. Los préstamos federales tienen términos fijos y regulados que los privados no tienen."}}, "sources_note": {"en": "Sources for financial aid facts: Texas Higher Education Coordinating Board, TASFA, and Federal Student Aid, 2026-27 FAFSA deadlines.", "es": "Fuentes de los datos de ayuda financiera: Texas Higher Education Coordinating Board, TASFA, y Federal Student Aid, fechas límite del FAFSA 2026-27."}, "closing": {"clinic_en": "AP Clinica, Thursdays 5:00 to 8:00 PM, East Harris County Activity Center, 7340 Spencer Hwy, Pasadena.", "clinic_es": "AP Clinica, jueves de 5:00 a 8:00 PM, East Harris County Activity Center, 7340 Spencer Hwy, Pasadena.", "closing_es_line": "Porque nadie debería recorrer el camino solo.", "footer": "Anchored Pathways to Higher Education, Inc. | EIN: 39-4454436 | Houston, Texas | 501(c)(3) nonprofit"}, "links": {"military_career": {"url": "https://contact432.github.io/anchored-pathways-pages/military-career-pathways.html", "label": {"en": "Military and career pathways guide", "es": "Guía de caminos militares y de carrera"}}, "workforce_training": {"url": "https://contact432.github.io/anchored-pathways-pages/workforce-training-programs.html", "label": {"en": "Workforce training programs", "es": "Programas de capacitación laboral"}}, "find_your_path": {"url": "https://contact432.github.io/anchored-pathways-pages/find-your-path-guide.html", "label": {"en": "Find your path guide", "es": "Guía para encontrar su camino"}}, "adult_learners": {"url": "https://contact432.github.io/anchored-pathways-pages/starting-again-adult-learners.html", "label": {"en": "Starting again: guide for adult learners", "es": "Comenzar de nuevo: guía para estudiantes adultos"}}, "checklist": {"url": "../checklist/", "label": {"en": "Open the Family Checklist", "es": "Abrir la Lista de Verificación Familiar"}}, "app": {"url": "../", "label": {"en": "Open the full Anchored Pathways app", "es": "Abrir la aplicación completa de Anchored Pathways"}}, "link_fafsa_tasfa_shared": {"url": "https://contact432.github.io/anchored-pathways-pages/fafsa-vs-tasfa.html", "label": {"en": "Read the full FAFSA vs. TASFA guide", "es": "Leer la guía completa de FAFSA vs. TASFA"}}}, "workbooks": [{"id": "family", "title": {"en": "Family Navigation Workbook", "es": "Cuaderno de Navegación Familiar"}, "intro": {"en": "A workbook for one-on-one navigation sessions and drop-in clinics.", "es": "Un cuaderno para sesiones de navegación individuales y clínicas de acceso libre."}, "how_to_use_label": {"en": "How to Use This Workbook", "es": "Cómo Usar Este Cuaderno"}, "how_to_use": {"en": "This workbook is meant to be filled out together, navigator and family, side by side, during a session, not handed over as homework. Not every section will apply to every family; skip what doesn't fit and come back to sections as the family's plan develops. There is no wrong place to start. Most families arrive somewhere in the middle of this process, not at the beginning, and that is normal.", "es": "Este cuaderno está diseñado para completarse juntos, navegador y familia, lado a lado, durante una sesión, no como tarea para llevar a casa. No todas las secciones aplicarán a cada familia; omita lo que no corresponda y regrese a las secciones a medida que el plan de la familia se desarrolle. No hay un lugar equivocado para comenzar. La mayoría de las familias llegan en algún punto intermedio de este proceso, no al principio, y eso es normal."}, "sections": [{"id": "s0", "title": {"en": "Section 0: Where We're Starting", "es": "Sección 0: Dónde Estamos Comenzando"}, "body": [{"type": "p", "text": {"en": "Anchored Pathways' framework has five stages. Families move through them at their own pace, and it's common to move back and forth rather than straight through.", "es": "El marco de trabajo de Anchored Pathways tiene cinco etapas. Las familias avanzan a su propio ritmo, y es común moverse hacia adelante y atrás en lugar de avanzar en línea recta."}}, {"type": "checkgroup", "field": "stage", "single": true, "options": [{"en": "Explore: still learning about options", "es": "Explora: todavía aprendiendo sobre las opciones"}, {"en": "Decide: narrowing down a path", "es": "Decide: reduciendo las opciones a un camino"}, {"en": "Advance: actively applying, filing forms, enrolling", "es": "Avanza: solicitando activamente, presentando formularios, inscribiéndose"}, {"en": "Persevere: in progress, working through challenges", "es": "Persevera: en progreso, superando desafíos"}, {"en": "Redefine: adjusting the plan based on what's happened so far", "es": "Redefine tu camino: ajustando el plan según lo que ha sucedido hasta ahora"}]}, {"type": "p", "text": {"en": "Which pathway(s) is this family exploring?", "es": "¿Qué camino(s) está explorando esta familia?"}}, {"type": "checkgroup", "field": "pathway_interest", "single": false, "options": [{"en": "College", "es": "Universidad"}, {"en": "Career or trade", "es": "Carrera técnica u oficio"}, {"en": "Military", "es": "Militar"}, {"en": "Not sure yet", "es": "Aún no lo sabe"}]}, {"type": "fields", "items": [{"field": "student_name", "label": {"en": "Student name", "es": "Nombre del estudiante"}, "kind": "text"}, {"field": "grade", "label": {"en": "Grade", "es": "Grado"}, "kind": "text"}, {"field": "date", "label": {"en": "Date", "es": "Fecha"}, "kind": "date"}]}]}, {"id": "s1", "title": {"en": "Section 1: Academics", "es": "Sección 1: Académico"}, "body": [{"type": "p", "text": {"en": "Academic planning looks different depending on grade level. Use this as a quick check-in, not a full transcript review.", "es": "La planificación académica se ve diferente según el grado escolar. Use esto como una revisión rápida, no como un análisis completo del expediente."}}, {"type": "p", "text": {"en": "9th-10th grade: Focus on grades, attendance, and exploring interests. Ask the counselor: “What classes should my child take next year to keep college and career options open?”", "es": "9.º-10.º grado: Concéntrese en las calificaciones, la asistencia y explorar intereses. Pregúntele al consejero: “¿Qué clases debería tomar mi hijo o hija el próximo año para mantener abiertas las opciones de universidad y carrera?”"}}, {"type": "p", "text": {"en": "11th grade: Testing window (SAT/ACT if the target school requires it; many Texas schools are now test-optional), dual credit or AP courses, first scholarship searches begin.", "es": "11.º grado: Período de exámenes (SAT/ACT si la escuela de interés lo requiere; muchas escuelas de Texas ya no lo exigen), cursos de crédito dual o AP, comienzan las primeras búsquedas de becas."}}, {"type": "p", "text": {"en": "12th grade: Finalize college list, request transcripts and letters of recommendation, confirm graduation requirements are on track, including the FAFSA/TASFA/Opt-Out requirement (see Section 2).", "es": "12.º grado: Finalizar la lista de universidades, solicitar expedientes y cartas de recomendación, confirmar que los requisitos de graduación van en curso, incluyendo el requisito de FAFSA/TASFA/Exención (vea la Sección 2)."}}, {"type": "p", "text": {"en": "Documents to start gathering now:", "es": "Documentos para empezar a reunir ahora:"}}, {"type": "checkgroup", "field": "s1_docs", "single": false, "options": [{"en": "Unofficial transcript", "es": "Expediente académico no oficial"}, {"en": "Test scores (if applicable)", "es": "Resultados de exámenes (si aplica)"}, {"en": "List of target schools/programs", "es": "Lista de universidades/programas de interés"}, {"en": "Counselor contact info", "es": "Información de contacto del consejero"}]}]}, {"id": "s2", "title": null, "shared_financial_aid": true, "body_before_shared": [{"type": "p", "text": {"en": "This is usually where families feel most unsure, and that is completely normal. Not knowing this system isn't a failure, it's the reason Anchored Pathways exists.", "es": "Esta suele ser la parte donde las familias se sienten más inseguras, y eso es completamente normal. No conocer este sistema no es un fracaso, es la razón por la que existe Anchored Pathways."}}]}, {"id": "s3", "title": {"en": "Section 3: Scholarships", "es": "Sección 3: Becas"}, "body": [{"type": "p", "text": {"en": "Start local first: school counselor lists, community foundations, and employer/church scholarships often have less competition than national ones.", "es": "Comience localmente primero: las listas del consejero escolar, las fundaciones comunitarias y las becas de empleadores o iglesias a menudo tienen menos competencia que las nacionales."}}, {"type": "p", "text": {"en": "Track every scholarship's deadline, essay requirements, and recommendation letter needs on one list. Missing a document is more common than not qualifying.", "es": "Registre la fecha límite, los requisitos de ensayo y las cartas de recomendación de cada beca en una sola lista. Es más común olvidar un documento que no calificar."}}, {"type": "p", "text": {"en": "Ask for help early on essays; a navigator or counselor can review drafts, but the student's own voice should come through.", "es": "Pida ayuda temprano con los ensayos; un navegador o consejero puede revisar borradores, pero debe notarse la voz propia del estudiante."}}, {"type": "textarea", "field": "local_scholarships", "label": {"en": "Local scholarships to explore with your navigator", "es": "Becas locales para explorar con su navegador"}}]}, {"id": "s4", "title": null, "shared_payment_cost": true, "body_after_shared": []}, {"id": "s5", "title": {"en": "Section 5: Career & Military Pathways", "es": "Sección 5: Carreras y Caminos Militares"}, "body": [{"type": "p", "text": {"en": "Career/trade pathway: Community college certificate and associate-degree programs, apprenticeships, and industry certifications are legitimate, often faster and lower-cost routes into stable careers, not a “backup plan.”", "es": "Camino de carrera técnica u oficio: Los programas de certificado y título asociado en colegios comunitarios, los aprendizajes y las certificaciones de la industria son rutas legítimas, a menudo más rápidas y económicas, hacia carreras estables, no un “plan alterno.”"}}, {"type": "p", "text": {"en": "Military pathway: Talk with a recruiter and review ASVAB prep resources; ROTC programs can combine military service with a traditional college degree. Discuss eligibility questions (medical, legal, academic) with a navigator before meeting a recruiter, so the family walks in informed.", "es": "Camino militar: Hable con un reclutador y revise los recursos de preparación para el ASVAB; los programas ROTC pueden combinar el servicio militar con un título universitario tradicional. Discuta preguntas de elegibilidad (médica, legal, académica) con un navegador antes de reunirse con un reclutador, para que la familia llegue informada."}}, {"type": "p", "text": {"en": "Career exploration doesn't need to be final. It needs to be a direction to start moving in.", "es": "La exploración de carreras no necesita ser definitiva. Necesita ser una dirección para empezar a avanzar."}}, {"type": "linklist", "links": [{"ref": "military_career"}]}]}, {"id": "s6", "title": {"en": "Section 6: Scenario-Based Tips (“If your situation is...”)", "es": "Sección 6: Consejos Según el Escenario (“Si su situación es...”)"}, "body": [{"type": "scenario", "q": {"en": "No one in your family has gone to college before", "es": "Nadie en su familia ha ido a la universidad antes"}, "a": {"en": "That means you're building the roadmap, not following one that already exists, and that is exactly what a navigator is for. Bring every question, even ones that feel “too basic.” There is no such question here.", "es": "Eso significa que está construyendo el mapa, no siguiendo uno que ya existe, y para eso está exactamente un navegador. Traiga todas sus preguntas, incluso las que se sientan “demasiado básicas.” Aquí no existe esa pregunta."}}, {"type": "scenario", "q": {"en": "Your parents don't speak English and you're translating for them", "es": "Sus padres no hablan inglés y usted está traduciendo para ellos"}, "a": {"en": "You don't have to carry this alone. Ask your navigator for materials in English and Spanish and let them speak directly to your parents in Spanish when possible. You shouldn't be the only bridge in high-stakes financial conversations.", "es": "No tiene que llevar esto solo o sola. Pídale a su navegador materiales en inglés y español y permita que hable directamente con sus padres en español cuando sea posible. Usted no debería ser el único puente en conversaciones financieras de alto riesgo."}}, {"type": "scenario", "q": {"en": "You missed the FAFSA/TASFA priority deadline", "es": "Se le pasó la fecha límite prioritaria del FAFSA/TASFA"}, "a": {"en": "File anyway. The priority deadline affects the order aid is awarded, not whether you're allowed to apply. Contact the financial aid office directly to ask what's still available.", "es": "Preséntelo de todas formas. La fecha límite prioritaria afecta el orden en que se otorga la ayuda, no si se le permite aplicar. Contacte directamente a la oficina de ayuda financiera para preguntar qué sigue disponible."}}, {"type": "scenario", "q": {"en": "The award letter is confusing or the cost still feels too high", "es": "La carta de oferta de ayuda es confusa o el costo aún se siente muy alto"}, "a": {"en": "Call the school's financial aid office and ask for a cost breakdown in plain terms, and ask about appealing the award if family circumstances have changed. This is a normal, expected call to make. Financial aid offices field it constantly.", "es": "Llame a la oficina de ayuda financiera de la escuela y pida un desglose del costo en términos sencillos, y pregunte sobre apelar la oferta si las circunstancias familiares han cambiado. Esta es una llamada normal y esperada. Las oficinas de ayuda financiera la reciben constantemente."}}, {"type": "scenario", "q": {"en": "You're weighing military against college", "es": "Está considerando el servicio militar en lugar de la universidad"}, "a": {"en": "These aren't mutually exclusive. ROTC, military tuition assistance, and the GI Bill can combine both. Talk it through with a navigator before deciding either path is “instead of” the other.", "es": "Estas opciones no se excluyen mutuamente. El ROTC, la asistencia militar para matrícula y el GI Bill pueden combinar ambas. Hable esto con un navegador antes de decidir que un camino es “en lugar de” el otro."}}, {"type": "scenario", "q": {"en": "You need to work while in school", "es": "Necesita trabajar mientras estudia"}, "a": {"en": "Ask about on-campus work-study first; it's built to work around a class schedule. If off-campus work is the only option, prioritize course load over hours where possible, and revisit the plan each semester.", "es": "Pregunte primero sobre el estudio-trabajo en el campus; está diseñado para ajustarse al horario de clases. Si el trabajo fuera del campus es la única opción, priorice la carga de cursos sobre las horas cuando sea posible, y revise el plan cada semestre."}}]}, {"id": "s7", "title": {"en": "Section 7: Your Status / Action Plan", "es": "Sección 7: Su Estado / Plan de Acción"}, "body": [{"type": "p", "text": {"en": "Mirrors the future My Status dashboard: stage, applications, financial aid, scholarships, documents, notes.", "es": "Refleja el futuro panel de Mi Estado: etapa, solicitudes, ayuda financiera, becas, documentos, notas."}}, {"type": "statustable", "field": "status_table", "columns": {"en": ["Area", "Status", "Next step", "By when"], "es": ["Área", "Estado", "Próximo paso", "Para cuándo"]}, "rows": [{"en": "Applications", "es": "Solicitudes"}, {"en": "Financial Aid (FAFSA/TASFA)", "es": "Ayuda Financiera (FAFSA/TASFA)"}, {"en": "Scholarships", "es": "Becas"}, {"en": "Documents still needed", "es": "Documentos pendientes"}, {"en": "Navigator notes", "es": "Notas del navegador"}]}, {"type": "fields", "items": [{"field": "next_appt_date", "label": {"en": "Next appointment", "es": "Próxima cita"}, "kind": "text"}, {"field": "next_appt_with", "label": {"en": "With", "es": "Con"}, "kind": "text"}]}]}, {"id": "s8", "title": {"en": "Section 8: Quick Resource Directory", "es": "Sección 8: Directorio Rápido de Recursos"}, "body": [{"type": "p", "text": {"en": "Anchored Pathways: contact@anchoredpathways.org", "es": "Anchored Pathways: contact@anchoredpathways.org"}}, {"type": "p", "text": {"en": "Drop-in clinic: Thursdays, East Harris County Activity Center", "es": "Clínica de acceso libre: jueves, East Harris County Activity Center"}}, {"type": "linklist", "links": [{"ref": "find_your_path"}, {"ref": "adult_learners"}]}]}], "closing_text": {"en": "Not knowing how this system works is not a reflection of you or your family. It's a reflection of a system that was never designed to explain itself. Every question you bring here is a sign of strength, not a gap to be embarrassed about. We'll figure this out together, one step at a time.", "es": "No saber cómo funciona este sistema no es un reflejo de usted ni de su familia. Es un reflejo de un sistema que nunca fue diseñado para explicarse a sí mismo. Cada pregunta que trae aquí es una señal de fortaleza, no una brecha de la cual avergonzarse. Lo resolveremos juntos, un paso a la vez."}, "storage_key": "ap_workbook_family_v1"}, {"id": "college", "title": {"en": "College Pathway Workbook", "es": "Cuaderno del Camino Universitario"}, "intro": {"en": "A printable workbook for the college pathway.", "es": "Un cuaderno imprimible para el camino universitario."}, "how_to_use_label": null, "how_to_use": null, "sections": [{"id": "c0", "title": null, "body": [{"type": "fields", "items": [{"field": "student_name", "label": {"en": "Student name", "es": "Nombre del estudiante"}, "kind": "text"}, {"field": "grade", "label": {"en": "Grade", "es": "Grado"}, "kind": "text"}, {"field": "date", "label": {"en": "Date", "es": "Fecha"}, "kind": "date"}]}]}, {"id": "c1", "title": {"en": "1. Academics Timeline", "es": "1. Cronología Académica"}, "body": [{"type": "p", "text": {"en": "9th-10th grade: Build strong grades and explore interests. Ask the counselor: “What classes keep my college options open next year?”", "es": "9.º-10.º grado: Mantenga buenas calificaciones y explore intereses. Pregunte al consejero: “¿Qué clases mantienen abiertas mis opciones universitarias el próximo año?”"}}, {"type": "p", "text": {"en": "11th grade: Take SAT/ACT if target schools require it (many Texas schools are test-optional now); start a college list, a mix of reach, target, and safety schools; begin scholarship searches.", "es": "11.º grado: Tome el SAT/ACT si las universidades de interés lo requieren (muchas escuelas de Texas ya no lo exigen); comience una lista de universidades, una mezcla de ambiciosas, realistas y seguras; comience búsquedas de becas."}}, {"type": "p", "text": {"en": "12th grade: Finalize the college list, request transcripts and recommendation letters, write and revise application essays, track each school's deadline type (Early Action/Decision, Regular, Rolling), confirm the FAFSA/TASFA/Opt-Out requirement is met (Section 2).", "es": "12.º grado: Finalice la lista de universidades, solicite expedientes y cartas de recomendación, escriba y revise ensayos de solicitud, registre el tipo de fecha límite de cada escuela (Acción Temprana/Decisión, Regular, Continua), confirme que cumplió el requisito de FAFSA/TASFA/Exención (Sección 2)."}}, {"type": "p", "text": {"en": "After acceptance: Compare award letters (Section 4), confirm enrollment deposit deadline, register for orientation, apply for on-campus housing if needed.", "es": "Después de la aceptación: Compare las cartas de oferta de ayuda (Sección 4), confirme la fecha límite del depósito de inscripción, regístrese para la orientación, solicite vivienda en el campus si es necesario."}}, {"type": "checkgroup", "field": "c1_docs", "single": false, "options": [{"en": "Unofficial transcript", "es": "Expediente no oficial"}, {"en": "Test scores (if applicable)", "es": "Resultados de exámenes (si aplica)"}, {"en": "College list with deadline types", "es": "Lista de universidades con tipos de fecha límite"}, {"en": "Essay draft", "es": "Borrador de ensayo"}, {"en": "Recommendation letter requests sent", "es": "Solicitudes de cartas de recomendación enviadas"}]}]}, {"id": "c2", "title": null, "shared_financial_aid": true, "body_before_shared": []}, {"id": "c3", "title": {"en": "3. Scholarships", "es": "3. Becas"}, "body": [{"type": "p", "text": {"en": "Start local: school counselor lists and community foundations often have less competition than national searches. Track deadlines, essays, and recommendation letters on one list.", "es": "Comience localmente: las listas del consejero escolar y las fundaciones comunitarias a menudo tienen menos competencia que las búsquedas nacionales. Registre fechas límite, ensayos y cartas de recomendación en una sola lista."}}, {"type": "textarea", "field": "local_scholarships", "label": {"en": "Local scholarships to explore", "es": "Becas locales para explorar"}}]}, {"id": "c4", "title": null, "shared_payment_cost": true, "body_after_shared": []}, {"id": "c5", "title": {"en": "5. College Scenario Tips", "es": "5. Consejos Según el Escenario Universitario"}, "body": [{"type": "scenario", "q": {"en": "First in your family to go to college", "es": "Primero en su familia en ir a la universidad"}, "a": {"en": "You're building the roadmap, not following one. Every question belongs here.", "es": "Está construyendo el mapa, no siguiendo uno. Cada pregunta pertenece aquí."}}, {"type": "scenario", "q": {"en": "Accepted, but the cost feels too high", "es": "Aceptado o aceptada, pero el costo se siente muy alto"}, "a": {"en": "Call the financial aid office and ask for a plain-language cost breakdown, and ask about appealing the award if circumstances changed.", "es": "Llame a la oficina de ayuda financiera y pida un desglose del costo en lenguaje sencillo, y pregunte sobre apelar la oferta si las circunstancias cambiaron."}}, {"type": "scenario", "q": {"en": "Choosing between multiple acceptances", "es": "Eligiendo entre varias aceptaciones"}, "a": {"en": "Compare net price, distance from home, and available support programs, not just reputation.", "es": "Compare el precio neto, la distancia de casa y los programas de apoyo disponibles, no solo la reputación."}}, {"type": "scenario", "q": {"en": "Missed the FAFSA/TASFA priority deadline", "es": "Se le pasó la fecha límite prioritaria del FAFSA/TASFA"}, "a": {"en": "File anyway; it affects award order, not eligibility to apply.", "es": "Preséntelo de todas formas; afecta el orden de la ayuda, no la elegibilidad para aplicar."}}]}, {"id": "c6", "title": {"en": "6. Status / Next Steps", "es": "6. Estado / Próximos Pasos"}, "body": [{"type": "statustable", "field": "status_table", "columns": {"en": ["Area", "Status", "Next step", "By when"], "es": ["Área", "Estado", "Próximo paso", "Para cuándo"]}, "rows": [{"en": "College list / applications", "es": "Lista de universidades / solicitudes"}, {"en": "Financial Aid (FAFSA/TASFA)", "es": "Ayuda Financiera (FAFSA/TASFA)"}, {"en": "Scholarships", "es": "Becas"}, {"en": "Documents still needed", "es": "Documentos pendientes"}]}, {"type": "fields", "items": [{"field": "next_appt_date", "label": {"en": "Next appointment", "es": "Próxima cita"}, "kind": "text"}, {"field": "next_appt_with", "label": {"en": "With", "es": "Con"}, "kind": "text"}]}, {"type": "linklist", "links": [{"ref": "find_your_path"}]}]}], "closing_text": null, "storage_key": "ap_workbook_college_v1"}, {"id": "trade", "title": {"en": "Career & Trade Pathway Workbook", "es": "Cuaderno del Camino de Carrera Técnica u Oficio"}, "intro": {"en": "A printable workbook for the career and trade pathway.", "es": "Un cuaderno imprimible para el camino de carrera técnica u oficio."}, "how_to_use_label": null, "how_to_use": null, "sections": [{"id": "t0", "title": null, "body": [{"type": "fields", "items": [{"field": "student_name", "label": {"en": "Student name", "es": "Nombre del estudiante"}, "kind": "text"}, {"field": "grade", "label": {"en": "Grade", "es": "Grado"}, "kind": "text"}, {"field": "date", "label": {"en": "Date", "es": "Fecha"}, "kind": "date"}]}]}, {"id": "t1", "title": {"en": "1. Academics & Program Timeline", "es": "1. Cronología Académica y del Programa"}, "body": [{"type": "p", "text": {"en": "9th-10th grade: Explore Career and Technical Education (CTE) courses at school; ask the counselor which programs feed into local certificate/associate degree paths.", "es": "9.º-10.º grado: Explore cursos de Educación Técnica y Profesional (CTE) en la escuela; pregunte al consejero qué programas conducen a certificados o títulos asociados locales."}}, {"type": "p", "text": {"en": "11th grade: Research target certification or associate-degree programs (community colleges, trade schools); check prerequisites; look into apprenticeship openings.", "es": "11.º grado: Investigue programas de certificación o título asociado de interés (colegios comunitarios, escuelas técnicas); verifique los requisitos previos; explore vacantes de aprendizaje."}}, {"type": "p", "text": {"en": "12th grade: Apply to the program, complete required entrance exams if any, confirm start date and cost, look into industry certification exam requirements for the field.", "es": "12.º grado: Solicite al programa, complete los exámenes de admisión requeridos si aplica, confirme la fecha de inicio y el costo, investigue los requisitos de exámenes de certificación de la industria para ese campo."}}, {"type": "checkgroup", "field": "t1_docs", "single": false, "options": [{"en": "CTE course history", "es": "Historial de cursos CTE"}, {"en": "Target program/certification list", "es": "Lista de programas/certificaciones de interés"}, {"en": "Apprenticeship applications (if applica , "title": {"en": "5. Career & Trade Scenario Tips", "es": "5. Consejos Según el Escenario de Carrera Técnica"}, "body": [{"type": "scenario", "q": {"en": "Worried this isn't “real college”", "es": "Le preocupa que esto no sea “universidad de verdad”"}, "a": {"en": "A certificate or associate-degree path is a legitimate, often faster and lower-cost route into a stable career, not a fallback.", "es": "Un camino de certificado o título asociado es una ruta legítima, a menudo más rápida y económica, hacia una carrera estable, no un plan alterno."}}, {"type": "scenario", "q": {"en": "Not sure which certification actually leads to a job", "es": "No está seguro o segura de qué certificación realmente lleva a un empleo"}, "a": {"en": "Ask the program directly about job placement rates and which employers hire their graduates before enrolling.", "es": "Pregunte directamente al programa sobre las tasas de colocación laboral y qué empleadores contratan a sus graduados antes de inscribirse."}}, {"type": "scenario", "q": {"en": "Family expects a 4-year degree", "es": "La familia espera un título de 4 años"}, "a": {"en": "It can help to bring a navigator into that conversation. Comparing real cost, time, and earning timelines side by side often reframes the discussion.", "es": "Puede ayudar incluir a un navegador en esa conversación. Comparar el costo real, el tiempo y las proyecciones de ingresos suele replantear la discusión."}}, {"type": "scenario", "q": {"en": "Not sure how to explain this path to family", "es": "No está seguro o segura de cómo explicar este camino a la familia"}, "a": {"en": "Practice explaining the program's outcome (the job, salary, and timeline), not just the program name. That's usually what reassures families most.", "es": "Practique explicando el resultado del programa (el empleo, salario y cronología), no solo el nombre del programa. Eso suele ser lo que más tranquiliza a las familias."}}]}, {"id": "t6", "title": {"en": "6. Status / Next Steps", "es" idad de programas ROTC en universidades de interés si combina el servicio militar con un título."}}, {"type": "p", "text": {"en": "11th-12th grade: Begin ASVAB (Armed Services Vocational Aptitude Battery) prep; meet with a recruiter. Bring a navigator-prepared question list first so the family walks in informed, not just informed by the recruiter.", "es": "11.º-12.º grado: Comience la preparación para el ASVAB (Batería de Aptitud Vocacional de las Fuerzas Armadas); reúnase con un reclutador. Traiga primero una lista de preguntas preparada con su navegador para que la familia llegue informada, no solo informada por el reclutador."}}, {"type": "p", "text": {"en": "12th grade: Take the ASVAB, discuss branch and job (MOS) options based on scores and interests, review eligibility factors (medical, legal, academic) with a navigator before finalizing enlistment paperwork or a service academy/ROTC application.", "es": "12.º grado: Tome el ASVAB, discuta opciones de rama y trabajo (MOS) según los resultados e intereses, revise los factores de elegibilidad (médicos, legales, académicos) con un navegador antes de finalizar el papeleo de alistamiento o una solicitud de academia militar/ROTC."}}, {"type": "checkgroup", "field": "m1_docs", "single": false, "options": [{"en": "Selective Service registration confirmed", "es": "Registro del Servicio Selectivo confirmado"}, {"en": "ASVAB prep started", "es": "Preparación del ASVAB iniciada"}, {"en": "Recruiter meeting scheduled", "es": "Reunión con reclutador programada"}, {"en": "ROTC/service academy applications (if applicable)", "es": "Solicitudes de ROTC/academia militar (si aplica)"}, {"en": "Required documents: birth certificate, Social Security card", "es": "Documentos requeridos: acta de nacimiento, tarjeta de Seguro Social"}]}, {"type": "linklist", "links": [{"ref": "military_career"}]}]}, {"id": "m2", "title": {"en": "2. Financial Aid & Military Education Benefits", "es": "2. Ayuda Financiera y Beneficios Educativos Militar <script>
const DATA = JSON.parse(document.getElementById('apdata').textContent);
const LANG_KEY = 'ap_workbooks_lang_v1';
let lang = 'en';
try { lang = localStorage.getItem(LANG_KEY) || 'en'; } catch (e) { lang = 'en'; }

const WORKBOOK_IDS = ['family', 'college', 'trade', 'military'];

function L(obj) {
  if (obj && typeof obj === 'object' && ('en' in obj || 'es' in obj)) {
    return obj[lang] || obj.en;
  }
  return obj;
}

// Headings, labels, buttons, and link text always show English then Spanish together
// (dual-language), regardless of the EN/ES toggle. Only long paragraph/body copy uses
// the toggle via L(), since showing both at once there would double the reading length.
function enEs(obj) {
  if (obj && typeof obj === 'object' && ('en' in obj || 'es' in obj)) {
    return { en: obj.en, es: (obj.es || obj.en) };
  }
  return { en: obj, es: obj };
}
function dualText(container, obj) {
  const pair = enEs(obj);
  container.appendChild(textNode(pair.en));
  container.appendChild(el('span', { className: 'es' }, [textNode(pair.es)]));
  return container;
}
function dualEl(tag, props, obj) {
  const e = el(tag, props, []);
  return dualText(e, obj);
}

const UI = {
  en: {
    pageTitle: "Workbooks",
    pageSubtitle: "Print-ready family workbooks in English and Spanish.",
    pickerIntro: "Choose a workbook below. Each one can be filled out on a phone or printed for a session. Answers are saved only on this device.",

    backToPicker: "\u2190 All workbooks",

    finishClearConfirm: "This will erase everything you typed in this workbook on this device. This cannot be undone. Continue?",
    finishClearDone: "Your answers have been cleared from this device.",
    studentNameLabel: "Student name",
    gradeLabel: "Grade",
    dateLabel: "Date",
    nextApptLabel: "Next appointment",
    withLabel: "With",
    unknownHash: "That workbook link wasn't recognized. Choose a workbook below.",
    appLink: "Open the full Anchored Pathways app",
    checklistLink: "Open the Family Checklist",

  },
  es: {
    pageTitle: "Cuadernos",
    pageSubtitle: "Cuadernos familiares listos para imprimir, en ingl\u00e9s y espa\u00f1ol.",
    pickerIntro: "Elija un cuaderno abajo. Cada uno se puede llenar en un tel\u00e9fono o imprimir para una sesi\u00f3n. Las respuestas se guardan solo en este dispositivo.",
    pickerGo: "Abrir cuaderno \u2192",
    backToPicker: "\u2190 Todos los cuadernos",
    crosslinksHeading: "M\u00e1s de Anchored Pathways",
    privacyNotice: "Sus respuestas permanecen en este dispositivo. Nada se env\u00eda a Anchored Pathways. Cualquier persona que use este dispositivo despu\u00e9s podr\u00eda verlas a menos que use Terminar y Borrar abajo.",
    finishClearBtn: "Terminar y Borrar",
    finishClearConfirm: "Esto borrar\u00e1 todo lo que escribi\u00f3 en este cuaderno en este dispositivo. Esta acci\u00f3n no se puede deshacer. \u00bfContinuar?",
    finishClearDone: "Sus respuestas se han borrado de este dispositivo.",

    dateLabel: "Fecha",
    nextApptLabel: "Pr\u00f3xima cita",
    withLabel: "Con",
    unknownHash: "Ese enlace de cuaderno no se reconoci\u00f3. Elija un cuaderno abajo.",

};

// Dual-language (English + Spanish shown together) strings for headings, labels,
// buttons, and link text. Kept separate from UI (which drives the EN/ES toggle for
// long body copy) per the house rule that short UI chrome shows both languages at once.
const UID = {
  pageTitle: { en: "Workbooks", es: "Cuadernos" },
  pageSubtitle: { en: "Print-ready family workbooks in English and Spanish.", es: "Cuadernos familiares listos para imprimir, en ingl\u00e9s y espa\u00f1ol." },
  pickerGo: { en: "Open workbook \u2192", es: "Abrir cuaderno \u2192" },

  finishClearBtn: { en: "Finish and Clear", es: "Terminar y Borrar" },
  studentNameLabel: { en: "Student name", es: "Nombre del estudiante" },
  gradeLabel: { en: "Grade", es: "Grado" },
  dateLabel: { en: "Date", es: "Fecha" },
  nextApptLabel: { en: "Next appointment", es: "Pr\u00f3xima cita" },
  withLabel: { en: "With", es: "Con" },
  appLink: { en: "Open the full Anchored Pathways app", es: "Abrir la aplicaci\u00f3n completa de Anchored Pathways" },
  checklistLink: { en: "Open the Family Checklist", es: "Abrir la Lista de Verificaci\u00f3n Familiar" },
};

function getWorkbook(id) {
  return DATA.workbooks.find(w => w.id === id);
}

function storageKeyFor(wb) {
  return wb.storage_key;
}

function loadAnswers(wb) {
  try {
    return JSON.parse(localStorage.getItem(storageKeyFor(wb))) || {};
  } catch (e) { return {}; }
}
function saveAnswers(wb, answers) {
  try { localStorage.setItem(storageKeyFor(wb), JSON.stringify(answers)); } catch (e) {}
}
function clearAnswers(wb) {
  try { localStorage.removeItem(storageKeyFor(wb)); } catch (e) {}
}

let currentAnswers = {};
let currentWb = null;

function setAnswer(field, value) {
  currentAnswers[field] = value;
  saveAnswers(currentWb, currentAnswers);
}

function el(tag, props, children) {
  const e = document.createElement(tag);
  if (props) {
    for (const [k, v] of Object.entries(props)) {
      if (k === 'className') e.className = v;
      else if (k === 'html') e.innerHTML = v;
      else if (k.startsWith('on')) e[k] = v;
      else e.setAttribute(k, v);
    }
  }
  (children || []).forEach(c => { if (c) e.appendChild(c); });
  return e;
}
function textNode(text) { return document.createTextNode(text); }

// ---------- Rendering: Landing / Picker ----------

function renderPicker() {
  const main = document.getElementById('main');
  main.innerHTML = '';
  document.getElementById('wbTopbar').hidden = true;
  document.getElementById('pageTitle').hidden = false;
  document.getElementById('pageSubtitle').hidden = false;

  const intro = el('p', { className: 'picker-intro' }, [textNode(UI[lang].pickerIntro)]);
  main.appendChild(intro);

  const grid = el('div', { className: 'picker-grid' });
  DATA.workbooks.forEach(wb => {
    const card = el('button', { className: 'picker-card', type: 'button', onclick: () => goToWorkbook(wb.id, true) });
    const h3 = dualEl('h3', {}, wb.title);
    const p = dualEl('p', {}, wb.intro || { en: '', es: '' });
    const go = dualEl('span', { className: 'go' }, UID.pickerGo);
    card.appendChild(h3);
    card.appendChild(p);
    card.appendChild(go);
    grid.appendChild(card);
  });
  main.appendChild(grid);

  const cross = el('div', { className: 'crosslinks' });
  const crossH = dualEl('h3', { style: 'margin:0 0 10px; font-size:14px; color: var(--navy);' }, UID.crosslinksHeading);
  cross.appendChild(crossH);
  cross.appendChild(makeLink(DATA.links.checklist));
  cross.appendChild(makeLink(DATA.links.app));
  main.appendChild(cross);
}

function makeLink(linkObj, extraClass) {
  const a = el('a', { href: linkObj.url, target: linkObj.url.startsWith('http') ? '_blank' : '_self', rel: 'noopener' }, []);
  dualText(a, linkObj.label);
  if (extraClass) a.className = extraClass;
  return a;
}

// ---------- Rendering: Workbook body blocks ----------

function renderFieldsBlock(item) {
  const wrap = el('div', { className: 'field-row' });
  const label = dualEl('label', {}, item.label);
  let input;
  if (item.kind === 'date') {
    input = el('input', { type: 'date' });
  } else {
    input = el('input', { type: 'text' });
  }
  input.value = currentAnswers[item.field] || '';
  input.addEventListener('input', () => setAnswer(item.field, input.value));
  input.addEventListener('change', () => setAnswer(item.field, input.value));
  wrap.appendChild(label);
  wrap.appendChild(input);
  return wrap;
}

function renderBodyItem(item, sectionId) {
  if (item.type === 'p') {
    return el('p', {}, [textNode(L(item.text))]);
  }
  if (item.type === 'fields') {
    const grid = el('div', { className: 'fields-grid' });
    item.items.forEach(f => grid.appendChild(renderFieldsBlock(f)));
    return grid;
  }
  if (item.type === 'checkgroup') {
    const wrap = el('div', { className: 'check-group' });
    item.options.forEach((opt, i) => {
      const fieldKey = item.field + '__' + i;
      const row = el('label', { className: 'check-row' });
      const inputType = item.single ? 'radio' : 'checkbox';
      const cb = el('input', { type: inputType });
      if (item.single) cb.name = sectionId + '_' + item.field;
      cb.checked = item.single
        ? (currentAnswers[item.field] === String(i))
        : !!currentAnswers[fieldKey];
      cb.addEventListener('change', () => {
        if (item.single) {
          setAnswer(item.field, String(i));
          // Uncheck siblings visually happens automatically via radio name grouping,
          // but re-render isn't required since browser handles radio exclusivity.
        } else {
          setAnswer(fieldKey, cb.checked);
        }
      });
      const span = el('span', {}, [textNode(L(opt))]);
      row.appendChild(cb);
      row.appendChild(span);
      wrap.appendChild(row);
    });
    return wrap;
  }
  if (item.type === 'textarea') {
    const wrap = el('div', { className: 'field-row' });
    const label = dualEl('label', {}, item.label);
    const ta = el('textarea', {});
    ta.value = currentAnswers[item.field] || '';
    ta.addEventListener('input', () => setAnswer(item.field, ta.value));
    ta.addEventListener('change', () => setAnswer(item.field, ta.value));
    wrap.appendChild(label);
    wrap.appendChild(ta);
    return wrap;
  }
  if (item.type === 'scenario') {
    const wrap = el('div', { className: 'scenario' });
    wrap.appendChild(dualEl('p', { className: 'q' }, item.q));
    wrap.appendChild(el('p', { className: 'a' }, [textNode(L(item.a))]));
    return wrap;
  }
  if (item.type === 'linklist') {
    const wrap = el('div', { className: 'linklist' });
    item.links.forEach(l => {
      const linkObj = DATA.links[l.ref];
      if (linkObj) wrap.appendChild(makeLink(linkObj));
    });
    return wrap;
  }
  if (item.type === 'statustable') {
    const scroll = el('div', { className: 'table-scroll' });
    const table = el('table', { className: 'status-table' });
    const thead = el('thead');
    const trh = el('tr');
    item.columns.en.forEach((c, ci) => trh.appendChild(dualEl('th', {}, { en: c, es: item.columns.es[ci] })));
    thead.appendChild(trh);
    table.appendChild(thead);
    const tbody = el('tbody');
    item.rows.forEach((rowLabel, ri) => {
      const tr = el('tr');
      tr.appendChild(dualEl('td', { className: 'area-cell' }, rowLabel));
      ['status', 'next', 'by'].forEach(colKey => {
        const fieldKey = item.field + '__' + ri + '__' + colKey;
        const td = el('td');
        const input = el('input', { type: 'text' });
        input.value = currentAnswers[fieldKey] || '';
        input.addEventListener('input', () => setAnswer(fieldKey, input.value));
        input.addEventListener('change', () => setAnswer(fieldKey, input.value));
        td.appendChild(input);
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    scroll.appendChild(table);
    return scroll;
  }
  return null;
}

function renderSharedFinancialAid() {
  const sfa = DATA.shared_financial_aid;
  const frag = document.createDocumentFragment();
  frag.appendChild(el('p', {}, [textNode('')])); // placeholder removed below if empty
  frag.removeChild(frag.firstChild);

  const step1 = el('p', {}, [
    el('strong', {}, [textNode(L(sfa.step1_label) + ': ')]),
    textNode(L(sfa.step1_text)),
  ]);
  frag.appendChild(step1);

  const step2 = el('p', {}, [
    el('strong', {}, [textNode(L(sfa.step2_label) + ': ')]),
    textNode(L(sfa.step2_text)),
  ]);
  frag.appendChild(step2);

  const step3Label = el('p', { style: 'margin-bottom:6px;' }, [el('strong', {}, [textNode(L(sfa.step3_label))])]);
  frag.appendChild(step3Label);
  const step3Group = el('div', { className: 'check-group' });
  sfa.step3_items.forEach((it, i) => {
    const fieldKey = 'sfa_step3__' + i;
    const row = el('label', { className: 'check-row' });
    const cb = el('input', { type: 'checkbox' });
    cb.checked = !!currentAnswers[fieldKey];
    cb.addEventListener('change', () => setAnswer(fieldKey, cb.checked));
    row.appendChild(cb);
    row.appendChild(el('span', {}, [textNode(L(it))]));
    step3Group.appendChild(row);
  });
  frag.appendChild(step3Group);

  const glossLabel = el('p', { style: 'margin: 12px 0 2px;' }, [el('strong', {}, [textNode(L(sfa.glossary_label))])]);
  frag.appendChild(glossLabel);
  const glossList = el('ul', { className: 'glossary-list' });
  sfa.glossary_items.forEach(g => glossList.appendChild(el('li', {}, [textNode(L(g))])));
  frag.appendChild(glossList);

  const mixed = el('p', { style: 'margin-top:12px;' }, [
    el('strong', {}, [textNode(L(sfa.mixed_status_label) + ': ')]),
    textNode(L(sfa.mixed_status_text)),
  ]);
  frag.appendChild(mixed);

  const linkWrap = el('div', { className: 'linklist' });
  linkWrap.appendChild(makeLink(sfa.link_fafsa_tasfa));
  linkWrap.appendChild(makeLink(sfa.link_studentaid));
  linkWrap.appendChild(makeLink(sfa.link_tasfa_gov));
  frag.appendChild(linkWrap);

  return frag;
}

function renderSharedPaymentCost() {
  const spc = DATA.shared_payment_cost;
  const frag = document.createDocumentFragment();
  frag.appendChild(el('p', {}, [textNode(L(spc.text))]));
  return frag;
}

function renderSection(section, wb) {
  const block = el('div', { className: 'section-block' });
  let heading = section.title || null;
  if (!heading && section.shared_financial_aid) heading = DATA.shared_financial_aid.heading;
  if (!heading && section.shared_payment_cost) heading = DATA.shared_payment_cost.heading;
  if (heading) block.appendChild(dualEl('div', { className: 'sec-head' }, heading));

  const body = el('div', { className: 'sec-body' });
  (section.body_before_shared || []).forEach(item => {
    const node = renderBodyItem(item, section.id);
    if (node) body.appendChild(node);
  });
  (section.body || []).forEach(item => {
    const node = renderBodyItem(item, section.id);
    if (node) body.appendChild(node);
  });
  if (section.shared_financial_aid) body.appendChild(renderSharedFinancialAid());
  if (section.shared_payment_cost) body.appendChild(renderSharedPaymentCost());
  (section.body_after_shared || []).forEach(item => {
    const node = renderBodyItem(item, section.id);
    if (node) body.appendChild(node);
  });

  block.appendChild(body);
  return block;
}

function renderClosingBlock() {
  const c = DATA.closing;
  const block = el('div', { className: 'closing-block' });
  block.appendChild(el('p', {}, [textNode(c.clinic_en)]));
  block.appendChild(el('p', { className: 'es-closing' }, [textNode(c.closing_es_line)]));
  return block;
}

function renderFinishClear(wb) {
  const wrap = el('div', { className: 'finish-clear-wrap' });
  const btn = el('button', { className: 'finish-clear-btn', type: 'button' }, [textNode(UI[lang].finishClearBtn + ' / ' + (lang === 'en' ? 'Terminar y Borrar' : 'Finish and Clear'))]);
  const confirmedMsg = el('p', { className: 'finish-confirmed', hidden: 'true' });
  btn.addEventListener('click', () => {
    if (confirm(UI[lang].finishClearConfirm + ' / ' + (lang === 'en' ? UI.es.finishClearConfirm : UI.en.finishClearConfirm))) {
      clearAnswers(wb);
      currentAnswers = {};
      // Clear all visible fields
      document.querySelectorAll('#main input[type=text], #main input[type=date], #main textarea').forEach(i => { i.value = ''; });
      document.querySelectorAll('#main input[type=checkbox], #main input[type=radio]').forEach(i => { i.checked = false; });
      confirmedMsg.hidden = false;
      confirmedMsg.textContent = UI[lang].finishClearDone + ' / ' + (lang === 'en' ? UI.es.finishClearDone : UI.en.finishClearDone);
    }
  });
  wrap.appendChild(btn);
  wrap.appendChild(confirmedMsg);
  return wrap;
}

function renderWorkbook(id) {
  const wb = getWorkbook(id);
  if (!wb) { renderPicker(); return; }
  currentWb = wb;
  currentAnswers = loadAnswers(wb);

  document.getElementById('pageTitle').hidden = true;
  document.getElementById('pageSubtitle').hidden = true;
  document.getElementById('wbTopbar').hidden = false;
  const topbar = document.getElementById('wbTopbar');
  topbar.innerHTML = '';
  const backBtn = dualEl('button', { className: 'back-btn', type: 'button', onclick: () => goToPicker(true) }, UID.backToPicker);
  const titleBlock = el('div', { className: 'wb-title-block' }, [
    dualEl('h2', {}, wb.title),
  ]);
  topbar.appendChild(backBtn);
  topbar.appendChild(titleBlock);

  const main = document.getElementById('main');
  main.innerHTML = '';

  if (wb.intro) main.appendChild(el('p', { className: 'intro-text' }, [textNode(L(wb.intro))]));

  if (wb.how_to_use) {
    const box = el('div', { className: 'how-to-use' });
    box.appendChild(el('h3', {}, [textNode(L(wb.how_to_use_label))]));
    box.appendChild(el('p', {}, [textNode(L(wb.how_to_use))]));
    main.appendChild(box);
  }

  // Privacy notice, above the first question
  main.appendChild(el('div', { className: 'privacy-notice' }, [
    el('p', {}, [textNode(UI.en.privacyNotice)]),
    el('p', {}, [textNode(UI.es.privacyNotice)]),
  ]));

  wb.sections.forEach(section => {
    main.appendChild(renderSection(section, wb));
  });

  if (DATA.sources_note) {
    main.appendChild(el('p', { className: 'sources-note' }, [textNode(L(DATA.sources_note))]));
  }

  if (wb.closing_text) {
    const box = el('div', { className: 'section-block' });
    const body = el('div', { className: 'sec-body' });
    body.appendChild(el('p', {}, [textNode(L(wb.closing_text))]));
    box.appendChild(body);
    main.appendChild(box);
  }

  main.appendChild(renderClosingBlock());
  main.appendChild(renderFinishClear(wb));

  const cross = el('div', { className: 'crosslinks' });
  const crossH = dualEl('h3', { style: 'margin:0 0 10px; font-size:14px; color: var(--navy);' }, UID.crosslinksHeading);
  cross.appendChild(crossH);
  cross.appendChild(makeLink(DATA.links.checklist));
  cross.appendChild(makeLink(DATA.links.app));
  main.appendChild(cross);

  window.scrollTo(0, 0);
}

function applyStaticText() {
  const pageTitleEl = document.getElementById('pageTitle');
  const pageSubtitleEl = document.getElementById('pageSubtitle');
  pageTitleEl.innerHTML = '';
  pageSubtitleEl.innerHTML = '';
  dualText(pageTitleEl, UID.pageTitle);
  dualText(pageSubtitleEl, UID.pageSubtitle);
  document.getElementById('btnEn').className = lang === 'en' ? 'active' : '';
  document.getElementById('btnEs').className = lang === 'es' ? 'active' : '';
}

function render() {
  applyStaticText();
  const hash = (location.hash || '').replace('#', '');
  if (WORKBOOK_IDS.includes(hash)) {
    renderWorkbook(hash);
  } else {
    renderPicker();
  }
}

function goToWorkbook(id, push) {
  if (push) {
    try { history.pushState({ wb: id }, '', '#' + id); } catch (e) { location.hash = id; }
  }
  renderWorkbook(id);
}

function goToPicker(push) {
  if (push) {
    try { history.pushState({ wb: null }, '', location.pathname + location.search); } catch (e) { location.hash = ''; }
  }
  renderPicker();
}

window.addEventListener('hashchange', () => {
  const hash = (location.hash || '').replace('#', '');
  if (WORKBOOK_IDS.includes(hash)) {
    renderWorkbook(hash);
  } else {
    renderPicker();
  }
});

document.getElementById('btnEn').onclick = () => {
  lang = 'en';
  try { localStorage.setItem(LANG_KEY, lang); } catch (e) {}
  render();
};
document.getElementById('btnEs').onclick = () => {
  lang = 'es';
  try { localStorage.setItem(LANG_KEY, lang); } catch (e) {}
  render();
};

render();

</script>
</body>
</html>
